name: Checks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install Rust components
        if: matrix.os == 'ubuntu-24.04'
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: matrix.os == 'ubuntu-24.04'
        run: cargo fmt --check

      - name: Clippy
        if: matrix.os == 'ubuntu-24.04'
        run: cargo clippy --release -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      - name: Compat suites
        if: matrix.os == 'ubuntu-24.04'
        run: |
          # Strict differential run against jq 1.8.1. It ratchets against
          # tests/jq_compat/diff_baseline_linux.txt; until that file exists it
          # only reports (commit baseline_candidate.txt from the artifact).
          JQ_DIFF_JQ="$(mise which jq)" cargo test --release jq_diff -- --ignored

      - name: Upload jq_diff results
        if: always() && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: jq-diff-linux
          path: |
            target/tmp/jq_diff/report.txt
            target/tmp/jq_diff/results.tsv
            target/tmp/jq_diff/baseline_candidate.txt
          if-no-files-found: ignore

      - name: Check benchmarks compile
        if: matrix.os == 'ubuntu-24.04'
        run: cargo bench --no-run

      - name: Regression benchmarks (iai-callgrind)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          cargo bench --bench eval_regression

      - name: Shellcheck
        if: matrix.os == 'ubuntu-24.04'
        run: git ls-files '*.sh' | xargs shellcheck
