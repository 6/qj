name: Checks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    # ci/** branches run the checks without a pull request (e.g. to verify
    # Linux before merging to main).
    branches: [main, 'ci/**']
  pull_request:

jobs:
  build-and-test:
    # The jq 1.8.1 port's suites (jq_diff's ~37k cases, fuzz-found corpora,
    # iai-callgrind) take far longer than the old 15 minutes on hosted runners.
    timeout-minutes: 60
    strategy:
      # Let each OS finish, so a failure on one still shows the other's results.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install Rust components
        if: matrix.os == 'ubuntu-24.04'
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: matrix.os == 'ubuntu-24.04'
        run: cargo fmt --check

      - name: Clippy
        if: matrix.os == 'ubuntu-24.04'
        run: cargo clippy --release -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Install locales
        if: matrix.os == 'ubuntu-24.04'
        run: |
          # German (with glibc's German messages) and Latin-1 French, for the
          # locale tests and jq_diff's corpus/locale.toml.
          sudo apt-get update -qq
          sudo apt-get install -y -qq language-pack-de-base language-pack-fr-base
          sudo localedef -i fr_FR -f ISO-8859-1 fr_FR.ISO-8859-1

      - name: Test
        run: cargo test --release

      - name: Compat suites
        if: matrix.os == 'ubuntu-24.04'
        run: |
          # Strict differential run against jq 1.8.1, ratcheting against
          # tests/jq_compat/diff_baseline_linux.txt. After a fix, record the
          # gains from the jq-diff-linux artifact's baseline_candidate.txt.
          JQ_DIFF_JQ="$(mise which jq)" cargo test --release jq_diff -- --ignored

      - name: Upload jq_diff results
        if: always() && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: jq-diff-linux
          path: |
            target/tmp/jq_diff/report.txt
            target/tmp/jq_diff/results.tsv
            target/tmp/jq_diff/baseline_candidate.txt
          if-no-files-found: ignore

      - name: Check benchmarks compile
        if: matrix.os == 'ubuntu-24.04'
        run: cargo bench --no-run

      - name: Regression benchmarks (iai-callgrind)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          cargo bench --bench eval_regression

      - name: Shellcheck
        if: matrix.os == 'ubuntu-24.04'
        run: git ls-files '*.sh' | xargs shellcheck
