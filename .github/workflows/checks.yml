name: Checks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    # ci/** branches run the checks without a pull request (e.g. to verify
    # Linux before merging to main).
    branches: [main, 'ci/**']
  pull_request:

jobs:
  build-and-test:
    # The jq 1.8.1 port's suites (jq_diff's ~37k cases, fuzz-found corpora,
    # iai-callgrind) take far longer than the old 15 minutes on hosted runners.
    timeout-minutes: 60
    strategy:
      # Let each OS finish, so a failure on one still shows the other's results.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install Rust components
        if: matrix.os == 'ubuntu-24.04'
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: matrix.os == 'ubuntu-24.04'
        run: cargo fmt --check

      - name: Clippy
        if: matrix.os == 'ubuntu-24.04'
        run: cargo clippy --release -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Install locales
        if: matrix.os == 'ubuntu-24.04'
        run: |
          # German (with glibc's German messages) and Latin-1 French, for the
          # locale tests and jq_diff's corpus/locale.toml.
          sudo apt-get update -qq
          sudo apt-get install -y -qq language-pack-de-base language-pack-fr-base
          sudo localedef -i fr_FR -f ISO-8859-1 fr_FR.ISO-8859-1

      - name: Test
        run: cargo test --release

      - name: Compat suites
        if: matrix.os == 'ubuntu-24.04'
        run: |
          # Strict differential runs against jq 1.8.1, both scoreboards: qj as
          # it is (ratcheting against tests/jq_compat/diff_baseline_linux.txt)
          # and QJ_JQ_COMPAT=1 with nothing normalized (against
          # diff_baseline_compat_linux.txt). After a fix, record the gains
          # from the jq-diff-linux artifact's baseline_candidate.txt files.
          JQ_DIFF_JQ="$(mise which jq)" cargo test --release jq_diff -- --ignored

      - name: Compat scoreboard (macOS)
        if: matrix.os == 'macos-26'
        run: |
          # QJ_JQ_COMPAT=1 against jq's macOS release binary, nothing
          # normalized, ratcheting against tests/jq_compat/diff_baseline_compat.txt.
          JQ_DIFF_JQ="$(mise which jq)" cargo test --release jq_diff_compat -- --ignored

      - name: Upload jq_diff results (macOS)
        if: always() && matrix.os == 'macos-26'
        uses: actions/upload-artifact@v4
        with:
          name: jq-diff-compat-macos
          path: |
            target/tmp/jq_diff/compat/report.txt
            target/tmp/jq_diff/compat/results.tsv
            target/tmp/jq_diff/compat/baseline_candidate.txt
          if-no-files-found: ignore

      - name: Upload jq_diff results
        if: always() && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: jq-diff-linux
          path: |
            target/tmp/jq_diff/report.txt
            target/tmp/jq_diff/results.tsv
            target/tmp/jq_diff/baseline_candidate.txt
            target/tmp/jq_diff/compat/report.txt
            target/tmp/jq_diff/compat/results.tsv
            target/tmp/jq_diff/compat/baseline_candidate.txt
          if-no-files-found: ignore

      - name: Check benchmarks compile
        if: matrix.os == 'ubuntu-24.04'
        run: cargo bench --no-run

      - name: Regression benchmarks (iai-callgrind)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          cargo bench --bench eval_regression

      - name: Shellcheck
        if: matrix.os == 'ubuntu-24.04'
        run: git ls-files '*.sh' | xargs shellcheck

  freebsd:
    # qj builds from source with `cargo install` wherever Rust does, and the
    # libc crate's bindings differ by platform (FreeBSD's rlim_t is signed,
    # and it has no strptime there), so build qj on FreeBSD, run the smoke
    # checks, and run the fast suite (as on NetBSD and musl: the platform
    # layer's own tests, and e2e's).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The VM gets the workspace with rsync and gives it back afterwards, so
      # target/ and a CARGO_HOME inside it can be cached on the host. Even
      # then, compiling qj itself takes most of the job, and thin LTO doubles
      # that, so these jobs (and musl's) test a release build without it.
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home
            target
          key: freebsd-15.1-nolto-${{ hashFiles('Cargo.lock') }}
          restore-keys: freebsd-15.1-nolto-

      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@v1.5.8
        with:
          release: '15.1'
          usesh: true
          prepare: pkg install -y rust
          run: |
            set -eux
            freebsd-version
            rustc --version
            export CARGO_HOME="$PWD/.cargo-home"
            export CARGO_PROFILE_RELEASE_LTO=false
            cargo test --release --no-run
            sh .github/smoke.sh ./target/release/qj
            cargo test --release --no-fail-fast

      - name: Prune the Cargo cache
        run: sh .github/prune_cargo_cache.sh

  netbsd:
    # NetBSD's C library has no uselocale, and the libc crate no binding for it.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The VM gets the workspace with rsync and gives it back afterwards, so
      # target/ and a CARGO_HOME inside it can be cached on the host. Even
      # then, compiling qj itself takes most of the job, and thin LTO doubles
      # that, so these jobs (and musl's) test a release build without it.
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home
            target
          key: netbsd-11.0-nolto-${{ hashFiles('Cargo.lock') }}
          restore-keys: netbsd-11.0-nolto-

      - name: Build and test on NetBSD
        uses: vmactions/netbsd-vm@v1.5.2
        with:
          release: '11.0'
          usesh: true
          prepare: /usr/sbin/pkg_add rust
          run: |
            set -eux
            uname -r
            rustc --version
            export CARGO_HOME="$PWD/.cargo-home"
            export CARGO_PROFILE_RELEASE_LTO=false
            cargo test --release --no-run
            sh .github/smoke.sh ./target/release/qj
            cargo test --release --no-fail-fast

      - name: Prune the Cargo cache
        run: sh .github/prune_cargo_cache.sh

  musl:
    # musl, the C library of Alpine and of static Linux builds, where the libc
    # crate doesn't define LC_ALL_MASK. Alpine's own Rust targets it.
    runs-on: ubuntu-24.04
    container: alpine:3.24
    timeout-minutes: 45
    env:
      CARGO_PROFILE_RELEASE_LTO: 'false'
    steps:
      # rust-cache saves with GNU tar's options, which busybox's tar rejects.
      - name: Install Rust, a C++ compiler and GNU tar
        run: apk add --no-cache build-base rust cargo tar zstd

      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          rustc --version --verbose
          cargo test --release --no-run

      - name: Smoke test
        run: sh .github/smoke.sh ./target/release/qj

      - name: Test
        run: cargo test --release --no-fail-fast

  windows:
    # Windows, built for MSVC, whose C runtime (UCRT) is the one jq's Windows
    # release binary uses. The conformance suites don't run here yet: qj is
    # compared byte for byte with that binary on cases that lean on what
    # Windows does differently (.github/windows_smoke.sh). The Benchmarks
    # workflow times the two.
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust and jq
        run: |
          # The versions mise.toml pins.
          version() { sed -n "s/^$1 = \"\(.*\)\"/\1/p" mise.toml; }
          rustup toolchain install "$(version rust)" --profile minimal
          rustup default "$(version rust)"
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          jq_url="https://github.com/jqlang/jq/releases/download/jq-$(version jq)"
          curl -fsSL -o "$bin/jq-windows-amd64.exe" "$jq_url/jq-windows-amd64.exe"
          curl -fsSL "$jq_url/sha256sum.txt" | grep ' jq-windows-amd64.exe$' > "$bin/jq.sha256"
          (cd "$bin" && sha256sum -c jq.sha256 && mv jq-windows-amd64.exe jq.exe)
          echo "$bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          rustc --version --verbose
          cargo build --release

      - name: Compare with jq
        run: bash .github/windows_smoke.sh "$PWD/target/release/qj.exe" "$(command -v jq.exe)"

      - name: jq_diff's cases
        # jq_diff's runner is Unix-only; this runs its .test cases (jq's
        # suites and the corpus, every mode) and its CLI cases under qj and
        # jq.exe and compares them the same way. Any mismatch .github/jq_diff_windows_known.txt
        # doesn't list fails the job. The scoreboard goes to the job summary,
        # every mismatch to the artifact's report.txt.
        if: always()
        run: |
          python .github/jq_diff_windows.py --qj target/release/qj.exe \
            --jq "$(cygpath -w "$(command -v jq.exe)")" --out target/tmp/jq_diff_windows \
            --known .github/jq_diff_windows_known.txt

      - name: Upload jq_diff results (Windows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jq-diff-windows
          path: |
            target/tmp/jq_diff_windows/report.txt
            target/tmp/jq_diff_windows/results.tsv
          if-no-files-found: ignore
