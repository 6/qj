# Programs qj evaluates on simdjson's tape, without building values
# (src/io/tape_eval.rs): paths, `.[]`, pipes, `length`, `keys`,
# `keys_unsorted`, `type`, `add`, `[...]`, `map`, `{...}` with constant keys,
# `select` on truthiness or comparison with a constant (with and, or, not,
# and `x | cond`), `.a?`, `.[]?`, and definitions without parameters
# (inlined, shadowing builtins as in jq). Their output
# must be jq's for every output option (the tape printer re-implements jq's
# layout), on single documents and on NDJSON (the parallel engine's workers
# and the calling thread run them), and when an input declines the shortcut
# (an error in jq, which the VM must then report exactly).
#
# Data (tests/jq_compat/corpus/data/):
# - tape.json: one pretty-printed document with duplicate keys, -0 and other
#   number spellings, big integers, escapes, control characters in keys;
# - tape_multi.json: documents one per line, one spanning two lines, arrays,
#   a string, empty containers (some programs error on some of them);
# - tape_types.json: documents of every kind, top-level scalars among them,
#   with edge values: NaN and infinity literals and numbers out of simdjson's
#   range (those documents take jq's parser and the VM), -0, subnormals, the
#   smallest normal and the largest double, escapes, duplicate keys, empty
#   and nested containers;
# - adv3.ndjson: see ndjson.toml.

[[sweep]]
name = "tape-options"
note = "Every output option on a pretty-printed document"
files = { "tape.json" = { path = "data/tape.json" } }
variants = { c = ["-c", "{program}", "tape.json"], pretty = ["{program}", "tape.json"], raw = ["-r", "{program}", "tape.json"], join = ["-j", "{program}", "tape.json"], ascii = ["-ac", "{program}", "tape.json"], asciiraw = ["-ar", "{program}", "tape.json"], sorted = ["-S", "{program}", "tape.json"], sortedc = ["-Sc", "{program}", "tape.json"], tab = ["--tab", "{program}", "tape.json"], indent0 = ["--indent", "0", "{program}", "tape.json"], indent7 = ["--indent", "7", "{program}", "tape.json"], exit = ["-e", "-c", "{program}", "tape.json"], unbuf = ["--unbuffered", "-c", "{program}", "tape.json"], color = ["-C", "-c", "{program}", "tape.json"], seq = ["--seq", "-c", "{program}", "tape.json"] }
programs = [
  ".",
  ".a",
  ".a.b",
  ".a.x",
  ".b",
  ".b.c",
  ".k1",
  ".s",
  '."a b"',
  '.["\u0001key"]',
  ".arr[]",
  ".arr[].a",
  ".arr[] | .b",
  ".[]",
  "[.[]]",
  "length",
  ".a | length",
  ".s | length",
  ".c | length",
  "keys",
  "keys_unsorted",
  ".arr[] | keys",
  "map(length)",
  ".arr | map(.a)",
  ".arr | map({a, b})",
  "{a, s}",
  '{x: .a.b, "y z": .d.d.d, e: [.c[]]}',
  ".arr[] | select(.a == 1)",
  '.arr[] | select(.a == "x") | .b',
  ".arr[] | select(.a != null)",
  ".arr[] | select(.a)",
  ".arr[] | select(.a == 1.0) | .b",
  ".arr | map(select(.b))",
  "select(.b == null) | .k1",
  ".a.b | length",
  ".missing",
  ".missing.deeper",
  ".arr[].b[]",
  ".a?",
  ".s.x?",
  ".arr[].b?",
  ".arr[].a.x?",
  ".arr[].b[]?",
  ".[]?",
  ".s[]?",
  "[.[][]?]",
  "[.arr[].a?]",
  ".arr | map(.b[]?)",
  ".a?.b",
  ".a.b[]? | .x",
  "def f: .arr; f[] | .a",
  "def keys: .k1; keys",
  "def f: keys; def keys: .k1; [f, keys] | length",
  "def f: keys; def keys: .k1; f",
  "def f: .a; def f: .arr; f | length",
  "def is_x: .a == \"x\"; .arr[] | select(is_x) | .b",
  "def select: .s; select(.a)",
  ".arr[] | select(.a > 0)",
  ".arr[] | select(.a >= 1) | .b",
  '.arr[] | select(.a < "y")',
  ".arr[] | select(.a <= null)",
  ".arr[] | select(.b > {})",
  ".a.b[] | select(. > 1.5)",
  ".a.b[] | select(1.50 >= .)",
  ".a.b[] | select(. < 12345678901234567891)",
  ".a.b[] | select(. <= -0)",
  "[.[] | select(length > 1)] | length",
  ".arr[] | select(.a == 1 and .b != null)",
  '.arr[] | select(.a == "x" or .b == 2)',
  ".arr[] | select(.b | not)",
  ".arr[] | select(.a and (.b | not))",
  ".arr[] | select(.a and .a.x)",
  ".arr[] | select(.a or .a.x)",
  ".arr[] | select(.a | not | not)",
  "def not: .b; .arr[] | select(not)",
  ".a.b | add",
  "[.arr[] | .a] | add",
  "[.arr[] | .b] | add",
  "add(.arr[] | .a?)",
  "[.[] | length] | add",
  "{n: add(.arr[]? | .a)}",
  "def add: .k1; add",
  "def f: .; def g: f | f; def h: g | g; def i: h | h; def j: i | i; def k: j | j; def l: k | k; def m: l | l; m | .s",
  "type",
  ".a | type",
  "map(type)",
  ".[] | type",
  ".arr | map(type)",
  ".arr[] | .b | type",
  "{t: type, a: (.a | type), s: (.s | type), b: (.b | type), c: (.c | type)}",
  ".s | type | length",
  "[.arr[] | type] | add",
  "select(type == \"object\") | .k1",
  ".arr[] | select(.a | type == \"number\")",
  '.arr[] | select(.b | type == "string" or type == "array")',
  ".arr[] | select(.a | length > 0)",
  'def is_str: type == "string"; [.[] | select(is_str)]',
  "def type: length; [.[] | type]",
]

[[sweep]]
name = "tape-multi"
note = "Several documents per file, some that make the programs error"
files = { "tape_multi.json" = { path = "data/tape_multi.json" }, "adv3.ndjson" = { path = "data/adv3.ndjson" } }
variants = { c = ["-c", "{program}", "tape_multi.json"], pretty = ["{program}", "tape_multi.json"], twice = ["-c", "{program}", "tape_multi.json", "tape_multi.json"], exit = ["-e", "-c", "{program}", "tape_multi.json"], raw = ["-r", "{program}", "tape_multi.json"], adv3 = ["-c", "{program}", "adv3.ndjson"], adv3raw = ["-r", "{program}", "adv3.ndjson"] }
programs = [
  ".",
  ".a",
  ".a.b",
  ".[]",
  ".a[]",
  ".a[] | .a",
  "length",
  "keys",
  "keys_unsorted",
  "map(.a)",
  "[.[] | length]",
  "{a, b}",
  "select(.a == 1)",
  "select(.a != -0)",
  "select(.b)",
  ".b | length",
  ".a?",
  ".a.b?",
  ".[]?",
  ".a[]?",
  "[.[]?]",
  "[.[] | .a?]",
  ".a[]? | .a?",
  "map(.b?)",
  "def f: .a; f",
  "def length: .b; length",
  "def is_one: .a == 1; select(is_one)",
  "select(.a > 1)",
  "select(.a <= 1)",
  'select(.a >= "x")',
  "select(.b < true)",
  "select(.a == 1 and .b)",
  "select(.a or .b)",
  "select(.a | not)",
  "select(.a and .a.b)",
  "add",
  "map(.a) | add",
  "[.[] | length] | add",
  "type",
  "map(type)",
  ".a | type",
  "[.[] | type]",
  'select(type == "object")',
  'select(.a | type == "object")',
]

[[sweep]]
name = "tape-stdin"
note = "The same through stdin"
stdin = { path = "data/tape_multi.json" }
variants = { c = ["-c", "{program}"], pretty = ["{program}"] }
programs = [".", ".a", ".[]", "length", "keys", "{a, b}", "select(.a == 1)"]

[[sweep]]
name = "tape-types"
note = "type on documents of every kind, some of which take jq's parser (NaN, infinities, numbers simdjson rejects)"
files = { "tape_types.json" = { path = "data/tape_types.json" } }
variants = { c = ["-c", "{program}", "tape_types.json"], pretty = ["{program}", "tape_types.json"], raw = ["-r", "{program}", "tape_types.json"], join = ["-j", "{program}", "tape_types.json"], ascii = ["-ac", "{program}", "tape_types.json"], asciiraw = ["-ar", "{program}", "tape_types.json"], sorted = ["-S", "{program}", "tape_types.json"], tab = ["--tab", "{program}", "tape_types.json"], exit = ["-e", "-c", "{program}", "tape_types.json"], color = ["-C", "-c", "{program}", "tape_types.json"], seq = ["--seq", "-c", "{program}", "tape_types.json"], twice = ["-c", "{program}", "tape_types.json", "tape_types.json"] }
programs = [
  ".",
  "type",
  "map(type)",
  ".[] | type",
  "[.[]? | type]",
  "{t: type, n: (.n | type), b: (.b | type)}",
  ".s | type",
  ".mix | map(type)",
  "type | length",
  "map(type) | add",
  "def kind: type; [.[]? | kind]",
  'select(type == "string")',
  'select(type == "number" or type == "boolean")',
  'select(.d | type == "array")',
  "map(type) | debug",
  "[.[]? | type | debug]",
]

[[sweep]]
name = "tape-types-stdin"
note = "The same through stdin"
stdin = { path = "data/tape_types.json" }
variants = { c = ["-c", "{program}"], raw = ["-r", "{program}"] }
programs = ["type", "map(type)", 'select(.a | type == "number")']

[[sweep]]
name = "tape-types-compat"
note = "QJ_JQ_COMPAT=1 (exactly jq) with programs the tape evaluates"
env = { QJ_JQ_COMPAT = "1" }
files = { "tape_types.json" = { path = "data/tape_types.json" } }
variants = { c = ["-c", "{program}", "tape_types.json"], raw = ["-r", "{program}", "tape_types.json"], exit = ["-e", "-c", "{program}", "tape_types.json"] }
programs = ["type", "map(type)", 'select(type == "object") | .a']

[[sweep]]
name = "tape-types-trace"
note = "--debug-trace (which prints every value's refcount) turns the tape off"
stdin = '{"a":1,"b":[null,"x"]} [true] "s"'
variants = { trace = ["-c", "--debug-trace", "{program}"], all = ["-c", "--debug-trace=all", "{program}"] }
programs = ["type", "map(type)"]

[[case]]
name = "tape-deep"
note = "Nesting past jq's print depth"
args = ["-c", ".a", "deep.json"]
files = { "deep.json" = { repeat = [['{"a":', 300], ["[1,-0,1.50]", 1], ["}", 300]] } }

[[case]]
name = "tape-deep-pretty"
args = [".a.a", "deep.json"]
files = { "deep.json" = { repeat = [['{"a":', 300], ["[1,-0,1.50]", 1], ["}", 300]] } }

[[case]]
name = "tape-deep-array"
args = ["-c", "[.[]]", "deep.json"]
files = { "deep.json" = { repeat = [["[", 260], ["-0", 1], ["]", 260]] } }

[[case]]
name = "tape-deep-length"
args = ["-c", "length", "deep.json"]
files = { "deep.json" = { repeat = [["[", 1000], ["]", 1000]] } }
