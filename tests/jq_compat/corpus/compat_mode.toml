# QJ_JQ_COMPAT=1: be exactly jq 1.8.1 (format: tests/jq_diff/cli.rs).
#
# qj deliberately differs from jq where jq 1.8.1 crashes or hangs, and it adds
# a few things jq doesn't have. `QJ_JQ_COMPAT=1` turns all of that off, so
# every case here must match jq byte for byte. See `src/compat.rs` and
# `docs/COMPATIBILITY.md`.
#
# The same env reaches jq, which ignores it — except that it sits on the
# stack with the rest of the environment, which moves jq's stack-overflow
# threshold by about one level per 64 bytes. The nesting depths below are far
# enough from that threshold for it not to matter.
#
# The cases where qj deliberately differs *without* the variable are unit and
# e2e tests, not cases here: jq is the expectation in this file, and the
# default behaviour is by definition not jq's.

# ---------------------------------------------------------------------------
# Crashes. jq dies of SIGSEGV; so does qj, at the same point in the run, with
# whatever it had buffered on stdout lost.
# ---------------------------------------------------------------------------

# A module that imports itself: jq's load_library adds a module to its table
# only after loading the module's own imports, so it recurses forever.
[[case]]
name = "module-imports-itself"
args = ["-nc", "-L", ".", "include \"a\"; 1"]
files = { "a.jq" = "import \"a\" as a;\ndef f: 1;\n" }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "module-import-cycle-of-two"
args = ["-nc", "-L", ".", "include \"a\"; 1"]
files = { "a.jq" = "import \"b\" as b;\ndef f: 1;\n", "b.jq" = "import \"a\" as a;\ndef g: 1;\n" }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "module-import-cycle-via-import"
args = ["-nc", "-L", ".", "import \"a\" as a; 1"]
files = { "a.jq" = "import \"a\" as a;\ndef f: 1;\n" }
env = { QJ_JQ_COMPAT = "1" }

# A module imported twice from different places is not a cycle.
[[case]]
name = "module-imported-twice-is-fine"
args = ["-nc", "-L", ".", "include \"a\"; include \"b\"; f + g"]
files = { "a.jq" = "def f: 1;\n", "b.jq" = "include \"a\";\ndef g: f + 1;\n" }
env = { QJ_JQ_COMPAT = "1" }

# jq's jv_free recurses once per level of nesting; past `ulimit -s` the
# process dies. 200,000 is well past the ~130,000 the default 8 MB stack
# allows, and 100,000 well short of it (src/compat.rs has the measurements).
[[case]]
name = "deep-value-freed-by-a-builtin"
args = ["-nc", "reduce range(200000) as $i (null;[.]) | length"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "deep-value-printed"
args = ["-nc", "reduce range(200000) as $i (null;[.])"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "deep-value-discarded"
args = ["-nc", "reduce range(200000) as $i (null;[.]) | empty"]
env = { QJ_JQ_COMPAT = "1" }

# Past a 16 MB stack too (GitHub's Linux runners have `ulimit -s 16384`, where
# jq's Linux/x86-64 binary survives about 349,000 levels, and macOS's about
# 262,000).
[[case]]
name = "deep-value-freed-by-a-builtin-past-16mb"
args = ["-nc", "reduce range(600000) as $i (null;[.]) | length"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "deep-value-printed-past-16mb"
args = ["-nc", "reduce range(600000) as $i (null;[.])"]
env = { QJ_JQ_COMPAT = "1" }

# Input can't get there: jq's parser stops at MAX_PARSING_DEPTH (10,000).
[[case]]
name = "deep-input-hits-the-parser-limit"
args = ["-c", "length"]
stdin = { repeat = [["[", 20000], ["]", 20000]] }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "not-deep-enough-to-crash"
args = ["-nc", "reduce range(100000) as $i (null;[.]) | length"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "not-deep-enough-to-crash-printed"
args = ["-nc", "reduce range(100000) as $i (null;[.]) | tostring | length"]
env = { QJ_JQ_COMPAT = "1" }

# ---------------------------------------------------------------------------
# jq's other recursions over values and paths (`Site` in src/compat.rs). Each
# has its own frame size, so each has its own threshold; the depths here are
# far from every one of them on both platforms, so what jq does is the same on
# every run:
#
#  * 600,000 is past every model at every stack limit, on macOS and on the
#    16 MB stacks of GitHub's Linux runners: both tools die.
#  * 20,000 is short of every model at 8 MB or more: both tools answer.
#  * the depths in between are past some models and short of others, which is
#    what shows that each site has a threshold of its own. They are chosen
#    with thousands of levels of room on both platforms, so the answer never
#    depends on which one is running (jq's Linux binary starts its stack up to
#    8 KB below the top at random, which moves its thresholds by about 50
#    levels).
# ---------------------------------------------------------------------------

# jv_setpath recurses once per path element, whatever the value looks like.
[[case]]
name = "setpath-with-a-path-past-every-model"
args = ["-nc", "[range(600000)|0] as $p | null | setpath($p; 1) | length"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "setpath-with-a-short-path"
args = ["-nc", "[range(20000)|0] as $p | null | setpath($p; 1) | length"]
env = { QJ_JQ_COMPAT = "1" }

# Assignment is setpath too, with the same threshold.
[[case]]
name = "assignment-through-a-path-past-every-model"
args = ["-nc", "[range(600000)|0] as $p | null | (getpath($p) = 1) | length"]
env = { QJ_JQ_COMPAT = "1" }

# Past the 8 MB threshold, short of the 16 MB one: jq dies on macOS and
# answers on GitHub's Linux runners, and so does qj.
[[case]]
name = "setpath-with-a-path-past-the-8mb-model"
args = ["-nc", "[range(80000)|\"a\"] as $p | null | setpath($p; 1) | length"]
env = { QJ_JQ_COMPAT = "1" }

# getpath is jq's one *tail* call through a path: both compilers turn it into
# a loop, so no path is long enough to overflow it.
[[case]]
name = "getpath-through-a-very-long-path"
args = ["-nc", "[range(600000)|0] as $p | null | getpath($p)"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "getpath-through-a-long-path-into-a-value"
args = [
    "-nc",
    "(reduce range(20000) as $i (null;[.])) as $v | [range(19990)|0] as $p | $v | getpath($p) | length",
]
env = { QJ_JQ_COMPAT = "1" }

# delpaths_sorted recurses once per level of the paths it groups, and only as
# far as the value has children.
[[case]]
name = "delpaths-with-a-path-past-every-model"
args = [
    "-nc",
    "(reduce range(600000) as $i (null;[.])) as $v | [$v] | delpaths([[0] + [range(600000)|0]]) | length",
]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "delpaths-with-a-short-path"
args = [
    "-nc",
    "(reduce range(20000) as $i (null;[.])) as $v | [$v] | delpaths([[0] + [range(19000)|0]]) | length",
]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "delpaths-with-a-path-past-the-8mb-model"
args = [
    "-nc",
    "(reduce range(60000) as $i (null;[.])) as $v | [$v] | delpaths([[0] + [range(50000)|0]]) | length",
]
env = { QJ_JQ_COMPAT = "1" }

# jv_object_merge_recursive (object `*`) descends where both sides are
# objects.
[[case]]
name = "merge-past-every-model"
args = ["-nc", "(reduce range(600000) as $i (null;{a:.})) as $v | ($v * $v) | length"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "merge-of-shallow-objects"
args = ["-nc", "(reduce range(20000) as $i (null;{a:.})) as $v | ($v * $v) | length"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "merge-past-the-8mb-model"
args = ["-nc", "(reduce range(100000) as $i (null;{a:.})) as $v | ($v * $v) | length"]
env = { QJ_JQ_COMPAT = "1" }

# Only where both sides are objects: an array on one side stops the descent,
# so this one is nowhere near the threshold.
[[case]]
name = "merge-stops-where-a-side-is-not-an-object"
args = ["-nc", "(reduce range(600000) as $i (null;{a:.})) as $v | ({a:1} * {a:$v}) | length"]
env = { QJ_JQ_COMPAT = "1" }

# jv_contains searches the elements of an array, so it reaches the depth of
# the attempts it makes.
[[case]]
name = "contains-past-every-model"
args = ["-nc", "(reduce range(600000) as $i (null;[.])) as $v | $v | contains($v)"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "contains-shallow"
args = ["-nc", "(reduce range(20000) as $i (null;[.])) as $v | $v | contains($v)"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "inside-past-the-8mb-model"
args = ["-nc", "(reduce range(100000) as $i (null;{a:.})) as $v | $v | inside($v)"]
env = { QJ_JQ_COMPAT = "1" }

# jv_equal and jv_cmp: two values built separately, so nothing is shared and
# the comparison goes all the way down.
[[case]]
name = "equal-past-every-model"
args = [
    "-nc",
    "(reduce range(600000) as $i (null;[.])) as $a | (reduce range(600000) as $i (null;[.])) as $b | $a == $b",
]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "equal-shallow"
args = [
    "-nc",
    "(reduce range(20000) as $i (null;[.])) as $a | (reduce range(20000) as $i (null;[.])) as $b | $a == $b",
]
env = { QJ_JQ_COMPAT = "1" }

# Past the comparison model but short of jv_free's: the comparison is what
# kills jq, and qj dies there too rather than later.
[[case]]
name = "equal-past-the-8mb-comparison-model"
args = [
    "-nc",
    "(reduce range(100000) as $i (null;[.])) as $a | (reduce range(100000) as $i (null;[.])) as $b | $a == $b",
]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "less-than-past-the-8mb-comparison-model"
args = [
    "-nc",
    "(reduce range(100000) as $i (null;{a:.})) as $a | (reduce range(100000) as $i (null;{a:.})) as $b | $a < $b",
]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "sort-past-every-model"
args = [
    "-nc",
    "[(reduce range(600000) as $i (null;[.])), (reduce range(600000) as $i (null;[.]))] | sort | length",
]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "sort-shallow"
args = [
    "-nc",
    "[(reduce range(20000) as $i (null;[.])), (reduce range(20000) as $i (null;[.]))] | sort | length",
]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "group-by-past-the-8mb-comparison-model"
args = [
    "-nc",
    "[(reduce range(100000) as $i (null;[.])), (reduce range(100000) as $i (null;[.]))] | group_by(.) | length",
]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "unique-past-the-8mb-comparison-model"
args = [
    "-nc",
    "[(reduce range(100000) as $i (null;[.])), (reduce range(100000) as $i (null;[.]))] | unique | length",
]
env = { QJ_JQ_COMPAT = "1" }

# Array subtraction and `indices` compare element by element with jv_equal.
[[case]]
name = "array-subtraction-past-the-8mb-comparison-model"
args = [
    "-nc",
    "[(reduce range(100000) as $i (null;[.]))] - [(reduce range(100000) as $i (null;[.]))] | length",
]
env = { QJ_JQ_COMPAT = "1" }

# jv_equal answers from the pointer when both sides are the same allocation,
# so comparing a value with itself never recurses however deep it is.
[[case]]
name = "equal-to-itself-takes-jqs-shortcut"
args = ["-nc", "(reduce range(600000) as $i (null;[.])) as $v | $v == $v"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "equal-to-a-copy-of-itself-takes-jqs-shortcut"
args = ["-nc", "(reduce range(600000) as $i (null;[.])) as $v | [$v, $v] | .[0] == .[1]"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "index-of-itself-takes-jqs-shortcut"
args = ["-nc", "(reduce range(600000) as $i (null;[.])) as $v | [$v] | index([$v])"]
env = { QJ_JQ_COMPAT = "1" }

# jv_cmp has no such shortcut, so sorting a value against itself does recurse:
# jq dies where `==` on the same two values answers immediately.
[[case]]
name = "sorting-one-value-with-itself-has-no-shortcut"
args = ["-nc", "(reduce range(600000) as $i (null;[.])) as $v | [$v, $v] | sort | length"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "unique-of-one-value-with-itself-has-no-shortcut"
args = ["-nc", "(reduce range(600000) as $i (null;[.])) as $v | [$v, $v] | unique | length"]
env = { QJ_JQ_COMPAT = "1" }

# Values of different lengths are unequal before anything is looked at, and
# arrays compare lexically, so the first element decides here.
[[case]]
name = "equal-stops-at-a-length-that-differs"
args = [
    "-nc",
    "(reduce range(600000) as $i (null;[.])) as $v | [[$v], [$v, 1]] | .[0] == .[1]",
]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "compare-stops-at-the-first-difference"
args = [
    "-nc",
    "(reduce range(600000) as $i (null;[.])) as $v | [[1, $v], [2, $v]] | .[0] < .[1]",
]
env = { QJ_JQ_COMPAT = "1" }

# ---------------------------------------------------------------------------
# One recursion from inside another. jq's delpaths_sorted compares path
# elements and frees values a level at a time, with the frames for the levels
# above it still on the stack, so the same value kills it sooner the deeper the
# paths go.
# ---------------------------------------------------------------------------

# A deep path element compared 1,000 levels into delpaths_sorted: past every
# comparison model there, short of it at the top (the 20,000-deep case below
# is the same program with a value jq can compare anywhere).
[[case]]
name = "deep-path-element-compared-inside-delpaths"
args = [
    "-nc",
    "(reduce range(200000) as $i (null;[.])) as $a | (reduce range(200000) as $i (null;[.])) as $b | (reduce range(1000) as $i ([1]; [.])) as $v | $v | try delpaths([[range(1000)|0] + [$a], [range(1000)|0] + [$b]]) catch \"err\"",
]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "shallow-path-element-compared-inside-delpaths"
args = [
    "-nc",
    "(reduce range(20000) as $i (null;[.])) as $a | (reduce range(20000) as $i (null;[.])) as $b | (reduce range(1000) as $i ([1]; [.])) as $v | $v | try delpaths([[range(1000)|0] + [$a], [range(1000)|0] + [$b]]) catch \"err\"",
]
env = { QJ_JQ_COMPAT = "1" }

# A deep value deleted 1,000 levels into delpaths_sorted, so jq frees it there.
[[case]]
name = "deep-value-freed-inside-delpaths"
args = [
    "-nc",
    "reduce range(1000) as $i ([reduce range(600000) as $j (null;[.])]; [.]) | delpaths([[range(1001)|0]]) | length",
]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "shallow-value-freed-inside-delpaths"
args = [
    "-nc",
    "reduce range(1000) as $i ([reduce range(20000) as $j (null;[.])]; [.]) | delpaths([[range(1001)|0]]) | length",
]
env = { QJ_JQ_COMPAT = "1" }

# A deep object merged 1,000 levels into jv_object_merge_recursive, where jq
# frees the value it replaces.
[[case]]
name = "deep-value-replaced-inside-a-merge"
args = [
    "-nc",
    "(reduce range(1000) as $i ({a:{b:(reduce range(600000) as $j (null;[.]))}}; {a:.})) as $x | ($x * $x) | length",
]
env = { QJ_JQ_COMPAT = "1" }

# jq_test.c reads the argument after --skip with atoi(argv[i+1]), which is
# atoi(NULL) at the end of argv. (qj does this in every mode.)
[[case]]
name = "run-tests-skip-without-a-count"
args = ["--run-tests", "--skip"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "run-tests-take-without-a-count"
args = ["--run-tests", "--take"]
env = { QJ_JQ_COMPAT = "1" }

# ---------------------------------------------------------------------------
# Hangs. jv_equal(nan, nan) is false, so delpaths_sorted never advances past a
# NaN path element: it loops forever, appending the key to an array as it
# goes. Neither tool finishes; the harness requires that of both.
# ---------------------------------------------------------------------------

[[case]]
name = "delpaths-nan-on-an-array"
args = ["-nc", "[1] | delpaths([[nan]])"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "delpaths-nan-on-an-object"
args = ["-nc", "{\"a\":1} | delpaths([[nan]])"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "delpaths-nan-under-try"
args = ["-nc", "[1] | try delpaths([[nan]]) catch \"caught\""]
env = { QJ_JQ_COMPAT = "1" }

# A NaN deeper in a path reaches the same loop, one level down.
[[case]]
name = "delpaths-nan-deeper-in-a-path"
args = ["-nc", "[[1]] | try delpaths([[0,nan]]) catch ."]
env = { QJ_JQ_COMPAT = "1" }

# ---------------------------------------------------------------------------
# qj's extensions, off.
# ---------------------------------------------------------------------------

# Glob expansion: jq opens the pattern as a file name and fails.
[[case]]
name = "glob-is-a-file-name"
args = ["-c", ".", "g*.json"]
files = { "g1.json" = "{\"a\":1}\n", "g2.json" = "{\"b\":2}\n" }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "glob-question-mark-is-a-file-name"
args = ["-c", ".", "g?.json"]
files = { "g1.json" = "{\"a\":1}\n" }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "glob-bracket-is-a-file-name"
args = ["-c", ".", "g[12].json"]
files = { "g1.json" = "{\"a\":1}\n" }
env = { QJ_JQ_COMPAT = "1" }

# A literal file called `*.json` is opened in both modes and in jq.
[[case]]
name = "a-file-really-called-star-json"
args = ["-c", ".", "*.json"]
files = { "*.json" = "{\"literal\":true}\n" }
env = { QJ_JQ_COMPAT = "1" }

# Decompression: jq reads the gzip bytes as JSON. (`{"x":1}` gzipped with a
# zero mtime, so the bytes are fixed.)
[[case]]
name = "gzip-file-is-read-as-bytes"
args = ["-c", ".", "c.json.gz"]
files = { "c.json.gz" = { b64 = "H4sIAAAAAAAC/6tWqlCyMqzlAgAV8DFQCAAAAA==" } }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "gzip-file-is-read-as-bytes-raw"
args = ["-Rc", "length", "c.json.gz"]
files = { "c.json.gz" = { b64 = "H4sIAAAAAAAC/6tWqlCyMqzlAgAV8DFQCAAAAA==" } }
env = { QJ_JQ_COMPAT = "1" }

# A `.gz` name whose content is plain JSON is read as JSON either way.
[[case]]
name = "gz-name-with-plain-content"
args = ["-c", ".", "plain.json.gz"]
files = { "plain.json.gz" = "{\"x\":1}\n" }
env = { QJ_JQ_COMPAT = "1" }

# qj-only options: jq's "Unknown option", exit 2.
[[case]]
name = "threads-is-unknown"
args = ["--threads", "2", "-c", ".", "in.json"]
files = { "in.json" = "{\"a\":1}\n" }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "threads-equals-is-unknown"
args = ["--threads=2", "-c", ".", "in.json"]
files = { "in.json" = "{\"a\":1}\n" }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "threads-without-a-count-is-unknown"
args = ["--threads"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "jsonl-is-unknown"
args = ["--jsonl", "-c", ".", "in.json"]
files = { "in.json" = "{\"a\":1}\n" }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "debug-timing-is-unknown"
args = ["--debug-timing", "-c", ".", "in.json"]
files = { "in.json" = "{\"a\":1}\n" }
env = { QJ_JQ_COMPAT = "1" }

# The option loop stops at the first unknown option, wherever it is, and
# options after a good one are still read the same way.
[[case]]
name = "unknown-option-after-a-good-one"
args = ["-c", "--jsonl", "."]
stdin = "1"
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "unknown-option-after-the-program"
args = ["-c", ".", "--threads", "2"]
stdin = "1"
env = { QJ_JQ_COMPAT = "1" }

# (`-h --jsonl` prints help and exits 0 in both tools, but qj's help text is
# its own, so it belongs in cli_meta.toml, not here.)

# After `--`, nothing is an option in either tool.
[[case]]
name = "threads-after-double-dash-is-a-file"
args = ["-c", ".", "--", "--threads"]
env = { QJ_JQ_COMPAT = "1" }

# ---------------------------------------------------------------------------
# Compat mode changes nothing else: ordinary programs, input modes and errors
# behave as they do without it.
# ---------------------------------------------------------------------------

[[case]]
name = "ordinary-program"
args = ["-c", "[.[] | . * 2]"]
stdin = "[1,2,3]\n[4,5]\n"
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "ordinary-files"
args = ["-c", ".", "a.json", "b.json"]
files = { "a.json" = "{\"a\":1}\n", "b.json" = "[2,3]\n" }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "ordinary-ndjson-file"
args = ["-c", "select(.n > 1) | .n", "in.ndjson"]
files = { "in.ndjson" = "{\"n\":1}\n{\"n\":2}\n{\"n\":3}\n" }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "ordinary-error"
args = ["-c", ".a"]
stdin = "1"
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "ordinary-missing-file"
args = ["-c", ".", "nope.json"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "ordinary-syntax-error"
args = ["-c", "1 +"]
stdin = "1"
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "delpaths-still-works"
args = ["-nc", "[[1,2],[3,4]] | delpaths([[0,1],[1,0]])"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "delpaths-slice-error-still-errors"
args = ["-nc", "[1,2,3,4] | try delpaths([[{}]]) catch ."]
env = { QJ_JQ_COMPAT = "1" }
note = "jq's double free here only kills it for some heap layouts; see docs/COMPATIBILITY.md"

# `QJ_JQ_COMPAT=0` is off, so qj expands this glob and jq doesn't: a
# deliberate difference, and not a case here. `src/cli/args/tests.rs` checks
# it instead.

# ---------------------------------------------------------------------------
# The compiler's recursions. At a normal stack limit every program bison will
# parse compiles in both tools; the thresholds themselves need a small
# `ulimit -s`, which a case here can't ask for (see CLAUDE.md), so they live in
# `tests/compat_mode.rs`. These check that nothing fires early — in compat mode
# the binding walks are jq's own, down to the lambda bound to itself.
# ---------------------------------------------------------------------------

# 4,900 nested closures: two `block_bind_subblock_inner` frames a level, which
# is what needs a 2 MB stack in jq. Bison stops at 4,990.
[[case]]
name = "deep-closures-compile"
args = ["-nc", "-f", "prog.jq"]
files = { "prog.jq" = { repeat = [["select(", 4900], ["true", 1], [")", 4900]] } }
env = { QJ_JQ_COMPAT = "1" }

# The same nesting through a C function's arguments, which bison reduces as it
# goes: not bounded by YYMAXDEPTH at all, only by how long a program is.
[[case]]
name = "deep-binops-compile"
args = ["-nc", "-f", "prog.jq"]
files = { "prog.jq" = { repeat = [[".", 1], [" + .", 9900]] } }
env = { QJ_JQ_COMPAT = "1" }

# 3,300 nested definitions: one `compile` frame a level, and binding does not
# descend them (a definition bound to itself has `any_unbound == 0`). Bison
# stops at 3,330.
[[case]]
name = "deep-defs-compile"
args = ["-nc", "-f", "prog.jq"]
files = { "prog.jq" = { repeat = [["def f: ", 3300], ["1", 1], ["; f", 3300]] } }
env = { QJ_JQ_COMPAT = "1" }

# Nested closures thrown away by a syntax error: jq's actions have bound all of
# it as bison reduced, and qj replays that lowering, so both report the error.
[[case]]
name = "deep-closures-syntax-error"
args = ["-nc", "-f", "prog.jq"]
files = { "prog.jq" = { repeat = [
    ["select(", 4900],
    ["true", 1],
    [")", 4900],
    [" | %%%", 1],
] } }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "deep-binops-syntax-error"
args = ["-nc", "-f", "prog.jq"]
files = { "prog.jq" = { repeat = [[".", 1], [" + .", 9900], [" | %%%", 1]] } }
env = { QJ_JQ_COMPAT = "1" }

# A nested constant folded during the parse: what `jv_free` recurses over at
# the end of the run is the program's own constant, not any input.
[[case]]
name = "deep-array-constant"
args = ["-nc", "-f", "prog.jq"]
files = { "prog.jq" = { repeat = [["[", 9900], ["1", 1], ["]", 9900]] } }
env = { QJ_JQ_COMPAT = "1" }

# `dump_disassembly` recurses over the same subfunction tree `compile` does.
[[case]]
name = "deep-defs-disassembled"
args = ["-nc", "--debug-dump-disasm", "-f", "prog.jq"]
files = { "prog.jq" = { repeat = [["def f: ", 200], ["1", 1], ["; f", 200]] } }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "deep-closures-disassembled"
args = ["-nc", "--debug-dump-disasm", "-f", "prog.jq"]
files = { "prog.jq" = { repeat = [["select(", 200], ["true", 1], [")", 200]] } }
env = { QJ_JQ_COMPAT = "1" }
