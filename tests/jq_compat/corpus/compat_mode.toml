# QJ_JQ_COMPAT=1: be exactly jq 1.8.2 (format: tests/jq_diff/cli.rs).
#
# qj deliberately differs from jq where jq 1.8.2 crashes, and it adds a few
# things jq doesn't have. `QJ_JQ_COMPAT=1` turns all of that off, so
# every case here must match jq byte for byte. See `src/compat.rs` and
# `docs/COMPATIBILITY.md`.
#
# The same env reaches jq, which ignores it — except that it sits on the
# stack with the rest of the environment, which moves jq's stack-overflow
# thresholds a little. No case below is near one of them.
#
# The cases where qj deliberately differs *without* the variable are unit and
# e2e tests, not cases here: jq is the expectation in this file, and the
# default behaviour is by definition not jq's.

# ---------------------------------------------------------------------------
# Crashes, and what jq 1.8.1 crashed on. Where jq 1.8.2 fails an assert(), it
# dies of SIGABRT, and so does qj, at the same point in the run.
# ---------------------------------------------------------------------------

# A module that imports itself: jq 1.8.1 recursed until its stack overflowed;
# jq 1.8.2 records a module before loading its imports and reports the
# circular import, in both modes.
[[case]]
name = "module-imports-itself"
args = ["-nc", "-L", ".", "include \"a\"; 1"]
files = { "a.jq" = "import \"a\" as a;\ndef f: 1;\n" }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "module-import-cycle-of-two"
args = ["-nc", "-L", ".", "include \"a\"; 1"]
files = { "a.jq" = "import \"b\" as b;\ndef f: 1;\n", "b.jq" = "import \"a\" as a;\ndef g: 1;\n" }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "module-import-cycle-via-import"
args = ["-nc", "-L", ".", "import \"a\" as a; 1"]
files = { "a.jq" = "import \"a\" as a;\ndef f: 1;\n" }
env = { QJ_JQ_COMPAT = "1" }

# A module imported twice from different places is not a cycle.
[[case]]
name = "module-imported-twice-is-fine"
args = ["-nc", "-L", ".", "include \"a\"; include \"b\"; f + g"]
files = { "a.jq" = "def f: 1;\n", "b.jq" = "include \"a\";\ndef g: f + 1;\n" }
env = { QJ_JQ_COMPAT = "1" }

# jq 1.8.2 links modules in the order it recorded them, each before the ones
# it imports, and block_drop_unreferenced, walking backwards, then frees the
# definitions of a module three imports from the program although the one two
# away calls them (it never walks that one's body). Compiling the call reads
# the freed definition, whose memory a RET allocated since has taken, and
# expand_call_arglist's assert() fails. A data import's global, freed the same
# way, fails nesting_level's assert() when a reference to it is compiled on
# Linux (glibc and musl) and Intel macOS, and on arm64 macOS stack_push's when
# it is read. Deterministic on each, in its own assert format; by default qj
# keeps what is called. (The macOS cases below show arm64's behaviour; on
# Intel, jq and qj both abort while compiling.)
[[case]]
name = "module-chain-of-three-aborts"
args = ["-L", ".", "-nc", "include \"m0\"; f"]
files = { "m0.jq" = "import \"m1\" as m;\ndef f: 0 + m::f;\n", "m1.jq" = "import \"m2\" as m;\ndef f: 1 + m::f;\n", "m2.jq" = "def f: 2;\n" }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "module-chain-of-three-namespaced-aborts"
args = ["-L", ".", "-nc", "import \"m0\" as m; m::f"]
files = { "m0.jq" = "import \"m1\" as m;\ndef f: 0 + m::f;\n", "m1.jq" = "import \"m2\" as m;\ndef f: 1 + m::f;\n", "m2.jq" = "def f: 2;\n" }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "module-chain-of-three-called-through-a-closure-aborts"
args = ["-L", ".", "-nc", "include \"m0\"; f"]
files = { "m0.jq" = "import \"m1\" as m;\ndef f: 0 + m::f;\n", "m1.jq" = "import \"m2\" as m;\ndef f: first(m::f);\n", "m2.jq" = "def f: 2;\n" }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "module-chain-of-three-errors-before-the-abort"
args = ["-L", ".", "-nc", "include \"m0\"; f"]
files = { "m0.jq" = "import \"m1\" as m;\ndef f: 0 + m::f;\n", "m1.jq" = "import \"m2\" as m;\ndef f: $nope + m::f;\n", "m2.jq" = "def f: 2;\n" }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "module-chain-of-three-not-called"
args = ["-L", ".", "-nc", "include \"m0\"; 1"]
files = { "m0.jq" = "import \"m1\" as m;\ndef f: 0 + m::f;\n", "m1.jq" = "import \"m2\" as m;\ndef f: 1 + m::f;\n", "m2.jq" = "def f: 2;\n" }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "module-chain-of-three-with-an-error-in-the-program"
args = ["-L", ".", "-nc", "include \"m0\"; f, $nope"]
files = { "m0.jq" = "import \"m1\" as m;\ndef f: 0 + m::f;\n", "m1.jq" = "import \"m2\" as m;\ndef f: 1 + m::f;\n", "m2.jq" = "def f: 2;\n" }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "module-chain-of-twelve-aborts"
args = ["-L", ".", "-nc", "include \"m0\"; f"]
env = { QJ_JQ_COMPAT = "1" }

[case.files]
"m0.jq" = "import \"m1\" as m;\ndef f: 0 + m::f;\n"
"m1.jq" = "import \"m2\" as m;\ndef f: 1 + m::f;\n"
"m2.jq" = "import \"m3\" as m;\ndef f: 2 + m::f;\n"
"m3.jq" = "import \"m4\" as m;\ndef f: 3 + m::f;\n"
"m4.jq" = "import \"m5\" as m;\ndef f: 4 + m::f;\n"
"m5.jq" = "import \"m6\" as m;\ndef f: 5 + m::f;\n"
"m6.jq" = "import \"m7\" as m;\ndef f: 6 + m::f;\n"
"m7.jq" = "import \"m8\" as m;\ndef f: 7 + m::f;\n"
"m8.jq" = "import \"m9\" as m;\ndef f: 8 + m::f;\n"
"m9.jq" = "import \"m10\" as m;\ndef f: 9 + m::f;\n"
"m10.jq" = "import \"m11\" as m;\ndef f: 10 + m::f;\n"
"m11.jq" = "def f: 11;\n"

[[case]]
name = "module-diamond-below-a-module-aborts"
args = ["-L", ".", "-nc", "include \"top\"; t"]
files = { "top.jq" = "import \"left\" as l;\nimport \"right\" as r;\ndef t: [l::v, r::v];\n", "left.jq" = "import \"base\" as b;\ndef v: [\"l\", b::v];\n", "right.jq" = "import \"base\" as b;\ndef v: [\"r\", b::v];\n", "base.jq" = "def v: \"base\";\n" }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "module-data-import-in-a-chain-aborts-when-read"
args = ["-L", ".", "-nc", "include \"m0\"; 1, f"]
os = "macos"
files = { "m0.jq" = "import \"m1\" as m;\ndef f: m::f;\n", "m1.jq" = "import \"d\" as $d;\ndef f: $d;\n", "d.json" = "[1,2,3]\n" }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "module-data-import-in-a-chain-not-read"
args = ["-L", ".", "-nc", "include \"m0\"; f"]
os = "macos"
files = { "m0.jq" = "import \"m1\" as m;\ndef f: m::f;\n", "m1.jq" = "import \"d\" as $d;\ndef f: if false then $d else 7 end;\n", "d.json" = "[1,2,3]\n" }
env = { QJ_JQ_COMPAT = "1" }

# On Linux the same programs abort while compiling: nothing is printed.
[[case]]
name = "module-data-import-in-a-chain-aborts-when-compiled-then-read"
args = ["-L", ".", "-nc", "include \"m0\"; 1, f"]
os = "linux"
files = { "m0.jq" = "import \"m1\" as m;\ndef f: m::f;\n", "m1.jq" = "import \"d\" as $d;\ndef f: $d;\n", "d.json" = "[1,2,3]\n" }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "module-data-import-in-a-chain-aborts-when-compiled-not-read"
args = ["-L", ".", "-nc", "include \"m0\"; f"]
os = "linux"
files = { "m0.jq" = "import \"m1\" as m;\ndef f: m::f;\n", "m1.jq" = "import \"d\" as $d;\ndef f: if false then $d else 7 end;\n", "d.json" = "[1,2,3]\n" }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "module-data-import-in-a-chain-namespaced-aborts-when-compiled"
args = ["-L", ".", "-nc", "import \"m0\" as a; a::f"]
os = "linux"
files = { "m0.jq" = "import \"m1\" as m;\ndef f: m::f;\n", "m1.jq" = "import \"d\" as $d;\ndef f: if false then $d else 7 end;\n", "d.json" = "[1,2,3]\n" }
env = { QJ_JQ_COMPAT = "1" }

# Nothing kept refers to the freed global, or nothing is called: no abort.
[[case]]
name = "module-data-import-in-a-chain-not-referred-to"
args = ["-L", ".", "-nc", "include \"m0\"; f"]
files = { "m0.jq" = "import \"m1\" as m;\ndef f: m::g;\n", "m1.jq" = "import \"d\" as $d;\ndef g: 7;\n", "d.json" = "[1,2,3]\n" }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "module-data-import-in-a-chain-not-called"
args = ["-L", ".", "-nc", "include \"m0\"; 1"]
files = { "m0.jq" = "import \"m1\" as m;\ndef f: m::f;\n", "m1.jq" = "import \"d\" as $d;\ndef f: $d;\n", "d.json" = "[1,2,3]\n" }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "module-data-import-two-deep"
args = ["-L", ".", "-nc", "import \"m1\" as a; a::f"]
files = { "m1.jq" = "import \"d\" as $d;\ndef f: if false then $d else 7 end;\n", "d.json" = "[1,2,3]\n" }
env = { QJ_JQ_COMPAT = "1" }

# jq 1.8.2's limit of 4095 subfunctions or parameters: an error, and where a
# function is cut short before any of its code, or a parameter past the limit
# is called, an assert() fails. By default qj reports the errors.
[[case]]
name = "too-many-parameters-then-the-last-called"
args = ["-nc", "-f", "p.jq"]
files = { "p.jq" = { repeat = [["def f(", 1], ["a;", 4096], ["x): x; def g: f(", 1], ["1;", 4096], ["1); g", 1]] } }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "too-many-parameters-then-empty-code"
args = ["-nc", "-f", "p.jq"]
files = { "p.jq" = { repeat = [["def f(", 1], ["a;", 4096], ["x): 1; def g: f(", 1], ["1;", 4096], ["1); g", 1]] } }
env = { QJ_JQ_COMPAT = "1" }

# Deep values freed and printed. jq 1.8.1's jv_free recursed once per level
# of nesting and died past about 130,000 levels at the default 8 MB stack;
# jq 1.8.2 frees without recursing, so 200,000 levels free in both tools, and
# print as 10,000 levels around `<skipped: too deep>` (MAX_PRINT_DEPTH).
[[case]]
name = "deep-value-freed-by-a-builtin"
args = ["-nc", "reduce range(200000) as $i (null;[.]) | length"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "deep-value-printed"
args = ["-nc", "reduce range(200000) as $i (null;[.])"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "deep-value-discarded"
args = ["-nc", "reduce range(200000) as $i (null;[.]) | empty"]
env = { QJ_JQ_COMPAT = "1" }

# Past where jq 1.8.1 died on a 16 MB stack too (GitHub's Linux runners have
# `ulimit -s 16384`, where its Linux/x86-64 binary survived about 349,000
# levels, and macOS's about 262,000): jq 1.8.2 frees these as well.
[[case]]
name = "deep-value-freed-by-a-builtin-past-16mb"
args = ["-nc", "reduce range(600000) as $i (null;[.]) | length"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "deep-value-printed-past-16mb"
args = ["-nc", "reduce range(600000) as $i (null;[.])"]
env = { QJ_JQ_COMPAT = "1" }

# Input can't get there: jq's parser stops at MAX_PARSING_DEPTH (10,000).
[[case]]
name = "deep-input-hits-the-parser-limit"
args = ["-c", "length"]
stdin = { repeat = [["[", 20000], ["]", 20000]] }
env = { QJ_JQ_COMPAT = "1" }

# 100,000 levels, short of where jq 1.8.1's jv_free overflowed.
[[case]]
name = "not-deep-enough-to-crash"
args = ["-nc", "reduce range(100000) as $i (null;[.]) | length"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "not-deep-enough-to-crash-printed"
args = ["-nc", "reduce range(100000) as $i (null;[.]) | tostring | length"]
env = { QJ_JQ_COMPAT = "1" }

# ---------------------------------------------------------------------------
# jq's other recursions over values and paths (`Site` in src/compat.rs). jq
# 1.8.2 stops each at 10,000 levels with an error: "Path too deep" (setpath,
# getpath, delpaths), "Object merge too deep" (object `*`), "Containment check
# too deep" (contains, inside), "Equality check too deep" (`==`, array `-`)
# and "Comparison too deep" (`<`, sort, group_by, unique). At 8 MB no stack
# runs out first, so every case here past 10,000 levels gets that error in
# both tools, whatever its name says.
#
# The names and depths come from jq 1.8.1, which had no limit, and where they
# were chosen against its stack models: 600,000 past every model at every
# stack limit, 20,000 short of every model at 8 MB, and the depths in between
# past some models and short of others.
# ---------------------------------------------------------------------------

# jv_setpath recurses once per path element, whatever the value looks like:
# past 10,000 elements the path is too deep.
[[case]]
name = "setpath-with-a-path-past-every-model"
args = ["-nc", "[range(600000)|0] as $p | null | setpath($p; 1) | length"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "setpath-with-a-short-path"
args = ["-nc", "[range(20000)|0] as $p | null | setpath($p; 1) | length"]
env = { QJ_JQ_COMPAT = "1" }

# Assignment is setpath too, with the same limit.
[[case]]
name = "assignment-through-a-path-past-every-model"
args = ["-nc", "[range(600000)|0] as $p | null | (getpath($p) = 1) | length"]
env = { QJ_JQ_COMPAT = "1" }

# jq 1.8.1 died here on macOS (past its 8 MB threshold) and answered on
# GitHub's Linux runners (short of the 16 MB one); jq 1.8.2's limit is the same
# on every platform.
[[case]]
name = "setpath-with-a-path-past-the-8mb-model"
args = ["-nc", "[range(80000)|\"a\"] as $p | null | setpath($p; 1) | length"]
env = { QJ_JQ_COMPAT = "1" }

# getpath is jq's one *tail* call through a path, which both compilers turn
# into a loop, so no path ever overflowed it; jq 1.8.2 limits its paths to
# 10,000 elements all the same.
[[case]]
name = "getpath-through-a-very-long-path"
args = ["-nc", "[range(600000)|0] as $p | null | getpath($p)"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "getpath-through-a-long-path-into-a-value"
args = [
    "-nc",
    "(reduce range(20000) as $i (null;[.])) as $v | [range(19990)|0] as $p | $v | getpath($p) | length",
]
env = { QJ_JQ_COMPAT = "1" }

# delpaths_sorted recurses once per level of the paths it groups, and only as
# far as the value has children; jq 1.8.2 rejects paths past 10,000 elements
# before it starts.
[[case]]
name = "delpaths-with-a-path-past-every-model"
args = [
    "-nc",
    "(reduce range(600000) as $i (null;[.])) as $v | [$v] | delpaths([[0] + [range(600000)|0]]) | length",
]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "delpaths-with-a-short-path"
args = [
    "-nc",
    "(reduce range(20000) as $i (null;[.])) as $v | [$v] | delpaths([[0] + [range(19000)|0]]) | length",
]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "delpaths-with-a-path-past-the-8mb-model"
args = [
    "-nc",
    "(reduce range(60000) as $i (null;[.])) as $v | [$v] | delpaths([[0] + [range(50000)|0]]) | length",
]
env = { QJ_JQ_COMPAT = "1" }

# jv_object_merge_recursive (object `*`) descends where both sides are
# objects, to 10,000 levels.
[[case]]
name = "merge-past-every-model"
args = ["-nc", "(reduce range(600000) as $i (null;{a:.})) as $v | ($v * $v) | length"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "merge-of-shallow-objects"
args = ["-nc", "(reduce range(20000) as $i (null;{a:.})) as $v | ($v * $v) | length"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "merge-past-the-8mb-model"
args = ["-nc", "(reduce range(100000) as $i (null;{a:.})) as $v | ($v * $v) | length"]
env = { QJ_JQ_COMPAT = "1" }

# Only where both sides are objects: an array on one side stops the descent,
# so this one is nowhere near the limit.
[[case]]
name = "merge-stops-where-a-side-is-not-an-object"
args = ["-nc", "(reduce range(600000) as $i (null;{a:.})) as $v | ({a:1} * {a:$v}) | length"]
env = { QJ_JQ_COMPAT = "1" }

# jv_contains searches the elements of an array, so it reaches the depth of
# the attempts it makes, to 10,000 levels.
[[case]]
name = "contains-past-every-model"
args = ["-nc", "(reduce range(600000) as $i (null;[.])) as $v | $v | contains($v)"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "contains-shallow"
args = ["-nc", "(reduce range(20000) as $i (null;[.])) as $v | $v | contains($v)"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "inside-past-the-8mb-model"
args = ["-nc", "(reduce range(100000) as $i (null;{a:.})) as $v | $v | inside($v)"]
env = { QJ_JQ_COMPAT = "1" }

# jv_equal and jv_cmp: two values built separately, so nothing is shared and
# the comparison goes down until it reaches the limit.
[[case]]
name = "equal-past-every-model"
args = [
    "-nc",
    "(reduce range(600000) as $i (null;[.])) as $a | (reduce range(600000) as $i (null;[.])) as $b | $a == $b",
]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "equal-shallow"
args = [
    "-nc",
    "(reduce range(20000) as $i (null;[.])) as $a | (reduce range(20000) as $i (null;[.])) as $b | $a == $b",
]
env = { QJ_JQ_COMPAT = "1" }

# In jq 1.8.1 past the comparison's 8 MB threshold but short of jv_free's, so
# the comparison was what killed it; in jq 1.8.2 it is what errors.
[[case]]
name = "equal-past-the-8mb-comparison-model"
args = [
    "-nc",
    "(reduce range(100000) as $i (null;[.])) as $a | (reduce range(100000) as $i (null;[.])) as $b | $a == $b",
]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "less-than-past-the-8mb-comparison-model"
args = [
    "-nc",
    "(reduce range(100000) as $i (null;{a:.})) as $a | (reduce range(100000) as $i (null;{a:.})) as $b | $a < $b",
]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "sort-past-every-model"
args = [
    "-nc",
    "[(reduce range(600000) as $i (null;[.])), (reduce range(600000) as $i (null;[.]))] | sort | length",
]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "sort-shallow"
args = [
    "-nc",
    "[(reduce range(20000) as $i (null;[.])), (reduce range(20000) as $i (null;[.]))] | sort | length",
]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "group-by-past-the-8mb-comparison-model"
args = [
    "-nc",
    "[(reduce range(100000) as $i (null;[.])), (reduce range(100000) as $i (null;[.]))] | group_by(.) | length",
]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "unique-past-the-8mb-comparison-model"
args = [
    "-nc",
    "[(reduce range(100000) as $i (null;[.])), (reduce range(100000) as $i (null;[.]))] | unique | length",
]
env = { QJ_JQ_COMPAT = "1" }

# Array subtraction and `indices` compare element by element with jv_equal,
# under its limit.
[[case]]
name = "array-subtraction-past-the-8mb-comparison-model"
args = [
    "-nc",
    "[(reduce range(100000) as $i (null;[.]))] - [(reduce range(100000) as $i (null;[.]))] | length",
]
env = { QJ_JQ_COMPAT = "1" }

# jv_equal answers from the pointer when both sides are the same allocation,
# so comparing a value with itself never recurses however deep it is.
[[case]]
name = "equal-to-itself-takes-jqs-shortcut"
args = ["-nc", "(reduce range(600000) as $i (null;[.])) as $v | $v == $v"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "equal-to-a-copy-of-itself-takes-jqs-shortcut"
args = ["-nc", "(reduce range(600000) as $i (null;[.])) as $v | [$v, $v] | .[0] == .[1]"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "index-of-itself-takes-jqs-shortcut"
args = ["-nc", "(reduce range(600000) as $i (null;[.])) as $v | [$v] | index([$v])"]
env = { QJ_JQ_COMPAT = "1" }

# jv_cmp has no such shortcut, so sorting a value against itself does recurse:
# jq reaches its limit where `==` on the same two values answers immediately.
[[case]]
name = "sorting-one-value-with-itself-has-no-shortcut"
args = ["-nc", "(reduce range(600000) as $i (null;[.])) as $v | [$v, $v] | sort | length"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "unique-of-one-value-with-itself-has-no-shortcut"
args = ["-nc", "(reduce range(600000) as $i (null;[.])) as $v | [$v, $v] | unique | length"]
env = { QJ_JQ_COMPAT = "1" }

# Values of different lengths are unequal before anything is looked at, and
# arrays compare lexically, so the first element decides here.
[[case]]
name = "equal-stops-at-a-length-that-differs"
args = [
    "-nc",
    "(reduce range(600000) as $i (null;[.])) as $v | [[$v], [$v, 1]] | .[0] == .[1]",
]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "compare-stops-at-the-first-difference"
args = [
    "-nc",
    "(reduce range(600000) as $i (null;[.])) as $v | [[1, $v], [2, $v]] | .[0] < .[1]",
]
env = { QJ_JQ_COMPAT = "1" }

# ---------------------------------------------------------------------------
# One recursion from inside another. jq's delpaths_sorted compares path
# elements and frees values a level at a time, with the frames for the levels
# above it still on the stack, so in jq 1.8.1 the same value killed it sooner
# the deeper the paths went. In jq 1.8.2 the comparison has its limit and
# freeing doesn't recurse.
# ---------------------------------------------------------------------------

# Path elements nested past 10,000 levels (200,000 here, 20,000 in the case
# below): sorting the paths is "Comparison too deep", jq 1.8.2's delpaths
# carries on with that invalid value as its list of paths, and
# jv_array_length's assert() fails. Both tools die of SIGABRT, `try` or not.
# (In jq 1.8.1 only the deeper one died, of a stack overflow.)
[[case]]
name = "deep-path-element-compared-inside-delpaths"
args = [
    "-nc",
    "(reduce range(200000) as $i (null;[.])) as $a | (reduce range(200000) as $i (null;[.])) as $b | (reduce range(1000) as $i ([1]; [.])) as $v | $v | try delpaths([[range(1000)|0] + [$a], [range(1000)|0] + [$b]]) catch \"err\"",
]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "shallow-path-element-compared-inside-delpaths"
args = [
    "-nc",
    "(reduce range(20000) as $i (null;[.])) as $a | (reduce range(20000) as $i (null;[.])) as $b | (reduce range(1000) as $i ([1]; [.])) as $v | $v | try delpaths([[range(1000)|0] + [$a], [range(1000)|0] + [$b]]) catch \"err\"",
]
env = { QJ_JQ_COMPAT = "1" }

# A deep value deleted 1,000 levels into delpaths_sorted, so jq frees it there:
# jq 1.8.1 overflowed its stack doing so, jq 1.8.2 doesn't recurse.
[[case]]
name = "deep-value-freed-inside-delpaths"
args = [
    "-nc",
    "reduce range(1000) as $i ([reduce range(600000) as $j (null;[.])]; [.]) | delpaths([[range(1001)|0]]) | length",
]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "shallow-value-freed-inside-delpaths"
args = [
    "-nc",
    "reduce range(1000) as $i ([reduce range(20000) as $j (null;[.])]; [.]) | delpaths([[range(1001)|0]]) | length",
]
env = { QJ_JQ_COMPAT = "1" }

# A deep object merged 1,000 levels into jv_object_merge_recursive (short of
# its limit), where jq frees the value it replaces, without recursing since
# 1.8.2.
[[case]]
name = "deep-value-replaced-inside-a-merge"
args = [
    "-nc",
    "(reduce range(1000) as $i ({a:{b:(reduce range(600000) as $j (null;[.]))}}; {a:.})) as $x | ($x * $x) | length",
]
env = { QJ_JQ_COMPAT = "1" }

# --skip or --take at the end of argv: jq 1.8.1 read atoi(NULL) and crashed;
# jq 1.8.2 says the option needs an argument.
[[case]]
name = "run-tests-skip-without-a-count"
args = ["--run-tests", "--skip"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "run-tests-take-without-a-count"
args = ["--run-tests", "--take"]
env = { QJ_JQ_COMPAT = "1" }

# ---------------------------------------------------------------------------
# What used to hang. jv_equal(nan, nan) is false, so jq 1.8.1's
# delpaths_sorted never advanced past a NaN path element: it looped forever,
# appending the key to an array, until the memory cap (256 MB for these, so
# that it got there well inside the timeout). jq 1.8.2 skips a NaN key in an
# array's paths, and an object's is the error any number key is.
# ---------------------------------------------------------------------------

[[case]]
name = "delpaths-nan-on-an-array"
args = ["-nc", "[1] | delpaths([[nan]])"]
env = { QJ_JQ_COMPAT = "1" }
mem_mb = 256

[[case]]
name = "delpaths-nan-on-an-object"
args = ["-nc", "{\"a\":1} | delpaths([[nan]])"]
env = { QJ_JQ_COMPAT = "1" }
mem_mb = 256

[[case]]
name = "delpaths-nan-under-try"
args = ["-nc", "[1] | try delpaths([[nan]]) catch \"caught\""]
env = { QJ_JQ_COMPAT = "1" }
mem_mb = 256

# A NaN deeper in a path is skipped the same way, one level down.
[[case]]
name = "delpaths-nan-deeper-in-a-path"
args = ["-nc", "[[1]] | try delpaths([[0,nan]]) catch ."]
env = { QJ_JQ_COMPAT = "1" }
mem_mb = 256

# ---------------------------------------------------------------------------
# qj's extensions, off.
# ---------------------------------------------------------------------------

# Glob expansion: jq opens the pattern as a file name and fails.
[[case]]
name = "glob-is-a-file-name"
args = ["-c", ".", "g*.json"]
files = { "g1.json" = "{\"a\":1}\n", "g2.json" = "{\"b\":2}\n" }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "glob-question-mark-is-a-file-name"
args = ["-c", ".", "g?.json"]
files = { "g1.json" = "{\"a\":1}\n" }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "glob-bracket-is-a-file-name"
args = ["-c", ".", "g[12].json"]
files = { "g1.json" = "{\"a\":1}\n" }
env = { QJ_JQ_COMPAT = "1" }

# A literal file called `*.json` is opened in both modes and in jq.
[[case]]
name = "a-file-really-called-star-json"
args = ["-c", ".", "*.json"]
files = { "*.json" = "{\"literal\":true}\n" }
env = { QJ_JQ_COMPAT = "1" }

# Decompression: jq reads the gzip bytes as JSON. (`{"x":1}` gzipped with a
# zero mtime, so the bytes are fixed.)
[[case]]
name = "gzip-file-is-read-as-bytes"
args = ["-c", ".", "c.json.gz"]
files = { "c.json.gz" = { b64 = "H4sIAAAAAAAC/6tWqlCyMqzlAgAV8DFQCAAAAA==" } }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "gzip-file-is-read-as-bytes-raw"
args = ["-Rc", "length", "c.json.gz"]
files = { "c.json.gz" = { b64 = "H4sIAAAAAAAC/6tWqlCyMqzlAgAV8DFQCAAAAA==" } }
env = { QJ_JQ_COMPAT = "1" }

# A `.gz` name whose content is plain JSON is read as JSON either way.
[[case]]
name = "gz-name-with-plain-content"
args = ["-c", ".", "plain.json.gz"]
files = { "plain.json.gz" = "{\"x\":1}\n" }
env = { QJ_JQ_COMPAT = "1" }

# qj-only options: jq's "Unknown option", exit 2.
[[case]]
name = "threads-is-unknown"
args = ["--threads", "2", "-c", ".", "in.json"]
files = { "in.json" = "{\"a\":1}\n" }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "threads-equals-is-unknown"
args = ["--threads=2", "-c", ".", "in.json"]
files = { "in.json" = "{\"a\":1}\n" }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "threads-without-a-count-is-unknown"
args = ["--threads"]
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "jsonl-is-unknown"
args = ["--jsonl", "-c", ".", "in.json"]
files = { "in.json" = "{\"a\":1}\n" }
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "debug-timing-is-unknown"
args = ["--debug-timing", "-c", ".", "in.json"]
files = { "in.json" = "{\"a\":1}\n" }
env = { QJ_JQ_COMPAT = "1" }

# The option loop stops at the first unknown option, wherever it is, and
# options after a good one are still read the same way.
[[case]]
name = "unknown-option-after-a-good-one"
args = ["-c", "--jsonl", "."]
stdin = "1"
env = { QJ_JQ_COMPAT = "1" }

[[case]]
name = "unknown-option-after-the-program"
args = ["-c", ".", "--threads", "2"]
stdin = "1"
env = { QJ_JQ_COMPAT = "1" }

# (`-h --jsonl` prints help and exits 0 in both tools, but qj's help text is
