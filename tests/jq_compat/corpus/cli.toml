# CLI cases for jq_diff (format: tests/jq_diff/cli.rs). Each case runs jq
# 1.8.1 and qj with exactly these args, stdin, files and env, in its own
# directory, and compares stdout, exit code and stderr byte for byte.
# Without `stdin`, stdin is /dev/null. jq's test modules are at ../../modules.

# ---------------------------------------------------------------------------
# Orchestrator audit probe t4.sh: argument handling and output options.
# ---------------------------------------------------------------------------

[[case]]
name = "args-before-program"
args = ["-n", "--args", "$ARGS", "a", "b"]

[[case]]
name = "args-after-program"
