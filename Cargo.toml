[package]
name = "qj"
version = "0.1.4"
edition = "2024"
autobenches = false
description = "A fast, jq-compatible JSON processor powered by simdjson"
license = "MIT"
keywords = ["json", "jq", "simd", "ndjson", "jsonl"]
categories = ["command-line-utilities", "text-processing"]
repository = "https://github.com/6/qj"
exclude = [
    ".github/",
    "benches/",
    "docs/",
    "fuzz/",
    "tests/",
    ".claude/",
    "CLAUDE.md",
    "mise.toml",
]

[features]
# The benchmark drivers (benches/bench_tools.rs, bench_mem.rs) parse their
# arguments with clap (qj itself parses jq's command line, src/cli/args.rs)
# and read hyperfine's JSON with serde_json.
bench = ["dep:clap", "dep:serde_json"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
libc = "0.2"
memchr = "2"
itoa = "1"
ryu = "1"
mimalloc = "0.1.48"
flate2 = "1"
zstd = "0.13"
glob = "0.3"
onig_sys = { version = "69.9.3", default-features = false }
hashbrown = { version = "0.16", default-features = false, features = ["inline-more"] }
foldhash = "0.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
iai-callgrind = "0.16"
flate2 = "1"
zstd = "0.13"
proptest = "1.10.0"
# The jq_diff harness (tests/jq_diff.rs) runs cases on a thread pool and
# stores binary content as base64.
rayon = "1"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.profiling]
inherits = "release"
strip = false
debug = 1

[profile.bench]
debug = true

[[bench]]
name = "parse_throughput"
harness = false

[[bench]]
name = "eval_regression"
harness = false

# src/main.rs is `#![no_main]` and defines `main` as a C function (see its
# docs), so it would replace libtest's entry point: a test harness for this
# target would just run qj. Its unit tests live in the library.
[[bin]]
name = "qj"
path = "src/main.rs"
test = false

[[bin]]
name = "bench_tools"
path = "benches/bench_tools.rs"
required-features = ["bench"]

[[bin]]
name = "bench_mem"
path = "benches/bench_mem.rs"
test = false
required-features = ["bench"]
