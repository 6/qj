[package]
name = "qj-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.qj]
path = ".."
# simdjson's fallback kernel, also on arm64, so the targets can fuzz it
# there (SIMDJSON_FORCE_IMPLEMENTATION=fallback) and fuzz_parse compares it
# with arm64.
features = ["simdjson-fallback"]

[workspace]
members = ["."]

# The FFI boundary: simdjson's DOM parser (TapeParser) on arbitrary bytes,
# every kernel the CPU runs against the others.
[[bin]]
name = "fuzz_parse"
path = "fuzz_targets/fuzz_parse.rs"
doc = false
test = false

# simdjson's tape to jq values, against jq's parser port.
[[bin]]
name = "fuzz_dom"
path = "fuzz_targets/fuzz_dom.rs"
doc = false
test = false

# The input layer (src/io): fast path, streaming and the parallel engine
# against jq's input loop.
[[bin]]
name = "fuzz_io_reader"
path = "fuzz_targets/fuzz_io_reader.rs"
doc = false
test = false

# Programs evaluated on simdjson's tape (src/io/tape_eval.rs) against the VM.
[[bin]]
name = "fuzz_tape"
path = "fuzz_targets/fuzz_tape.rs"
doc = false
test = false
