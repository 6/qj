[package]
name = "qj-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.qj]
path = ".."

[workspace]
members = ["."]

# The FFI boundary: simdjson's DOM parser (TapeParser) on arbitrary bytes.
[[bin]]
name = "fuzz_parse"
path = "fuzz_targets/fuzz_parse.rs"
doc = false
test = false

# simdjson's tape to jq values, against jq's parser port.
[[bin]]
name = "fuzz_dom"
path = "fuzz_targets/fuzz_dom.rs"
doc = false
test = false

# The input layer (src/io): fast path, streaming and the parallel engine
# against jq's input loop.
[[bin]]
name = "fuzz_io_reader"
path = "fuzz_targets/fuzz_io_reader.rs"
doc = false
test = false
